<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>GiveMeFive 布局模拟检查</title><link rel="stylesheet" href="pathline-base.css"><main class="page"><h1>iPad 尺寸布局模拟</h1><p>桌面浏览器中的 viewport 模拟，不代表真实 iPad Safari 验收。测试框架内嵌同一网站，仅用于尺寸检查。</p><button class="btn" id="test">检查横竖屏</button><pre id="results" aria-live="polite"></pre><div style="overflow:auto"><iframe id="frame" title="Fusion 布局检查" style="border:1px solid var(--line);height:1194px;width:834px" src="./#mindflow/focus"></iframe></div></main><script>
document.querySelector('#test').onclick=async()=>{const frame=document.querySelector('iframe'),out=document.querySelector('#results');out.textContent='';for(const [w,h] of [[834,1194],[1194,834],[768,1024]]){frame.style.width=w+'px';frame.style.height=h+'px';await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));const doc=frame.contentDocument,overflow=doc.documentElement.scrollWidth>w+1,focus=!!doc.querySelector('.mf-focus-panel'),buttons=[...doc.querySelectorAll('.mf-v3 button')].filter(e=>e.getBoundingClientRect().height>0);out.textContent+=`${w}×${h}: ${!overflow&&focus?'PASS':'FAIL'} · 页面宽 ${doc.documentElement.scrollWidth} · Focus ${focus} · 最小按钮高度 ${Math.min(...buttons.map(e=>e.getBoundingClientRect().height))}\n`;} };
</script></html>
