<!doctype html><html lang="zh"><meta charset="utf-8"><title>GiveMeFive 集成验证</title><link rel="stylesheet" href="pathline-base.css"><main class="page"><h1>原生 IndexedDB 集成验证</h1><p>仅使用 givemefive-qa-v3 测试数据库，不读写正式学习记录。</p><button class="btn" id="run">运行验证</button><pre id="result" aria-live="polite"></pre></main><script src="platform.js"></script><script src="learning-store.js" data-database="givemefive-qa-v3"></script><script type="module">
import {makePort,empty,migrateLegacy} from './mind-flow/v3/host.mjs';import {SessionCoordinator} from './mind-flow/v3/core/coordinator.mjs';import {totals} from './mind-flow/v3/core/session.mjs';
const out=document.querySelector('#result'),check=(b,m)=>{if(!b)throw Error(m);out.textContent+='PASS '+m+'\n';};
document.querySelector('#run').onclick=async()=>{out.textContent='';try{await LearningStore.open();const scope='run:'+crypto.randomUUID(),port=makePort(LearningStore),a=new SessionCoordinator(port,scope),b=new SessionCoordinator(port,scope),t=(n,r='a')=>({wall_ms:Date.UTC(2026,9,21)+n,mono_ms:n,runtime_id:r});const [x,y]=await Promise.all([a.start({session_id:crypto.randomUUID()},t(0)),b.start({session_id:crypto.randomUUID()},t(0,'b'))]);check(x.current.session_id===y.current.session_id,'两个独立协调器并发开始只创建一个 Session');let r=await a.read(),id=r.current.session_id,owner=r.current.anchor.runtime_id;await a.dispatch(id,r.current.revision,{type:'tick'},t(5000,owner));r=await a.read();check(totals(r.current).focus_ms===5000,'原生事务提交已确认时间');const revision=r.current.revision;const race=await Promise.allSettled([a.dispatch(id,revision,{type:'switch_task',task_id:'t1'},t(6000,owner)),b.dispatch(id,revision,{type:'pause'},t(6000,owner))]);check(race.filter(x=>x.status==='fulfilled').length===1,'并发同 revision 写入仅一方成功');r=await a.read();await a.dispatch(id,r.current.revision,{type:'recover'},t(999000,'new-runtime'));r=await a.read();check(r.current.state==='Paused'&&totals(r.current).focus_ms<=6000,'跨运行恢复安全暂停，不计离线间隔');await a.dispatch(id,r.current.revision,{type:'resume'},t(1000000,owner));await a.examStart('exam-qa',t(1000500,'as'));r=await a.read();check(r.current.state==='Paused','考试安全暂停 MF');let blocked=false;try{await b.dispatch(id,r.current.revision,{type:'resume'},t(1000600,'b'));}catch{blocked=true;}check(blocked,'考试持有计时权时禁止恢复 MF');await a.examEnd('exam-qa');check((await a.read()).current.state==='Paused','考试结束不会自动恢复');r=await a.read();await a.dispatch(id,r.current.revision,{type:'end'},t(1000700,owner));let before=await LearningStore.exportAll();check(before.stores.sessions.filter(s=>s.session_id===id).length===1&&before.stores.ledger.filter(e=>e.event_id===id).length===1,'结束时共享 Session / Ledger 原子且不重复');let aborted=false;try{await LearningStore.atomicModule(scope,r=>{r.tasks.push({task_id:'should-not-exist'});throw Error('forced rollback');});}catch{aborted=true;}check(aborted&&!(await a.read()).tasks.length,'写入失败整笔回滚');await LearningStore.putModule('mf-focus',{'mindflow.history.v1':[{goal:'legacy',mode:'free',elapsed:5000,steps:[{id:1,title:'old task',status:'pending'}],notes:[{text:'old blocker',taskId:1}]}]});await migrateLegacy(LearningStore);const first=await LearningStore.getModule('mf-v3');await migrateLegacy(LearningStore);const second=await LearningStore.getModule('mf-v3');check(first.tasks.length===second.tasks.length&&second.legacy_backup.focus['mindflow.history.v1'][0].elapsed===5000,'旧记录迁移可重复，原始数据保留');const backup=await LearningStore.exportAll();backup.stores.sessions.push({session_id:'import:'+crypto.randomUUID(),active_seconds:7});const restored=await LearningStore.restoreBackup(backup);check(restored.inserted===1&&restored.kept>0,'完整备份增量导入不覆盖已有学习记录');out.textContent+='RESULT 11/11 PASS\n';}catch(e){out.textContent+='FAIL '+e.stack;}};
</script></html>
