name: GMF V4.1 regression

on:
  push:
    branches:
      - fix/v4.1-validation-20261026
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend regression (requires complete course resources)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact repository snapshot
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend regression tests
        run: npm test

  backend:
    name: Backend regression including private question isolation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact repository snapshot
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Backend regression tests
        run: python -m pytest -q tests

  course-resources:
    name: Strict Pathline resource integrity (release gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact repository snapshot
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Audit runtime asset integrity
        run: python scripts/audit-runtime-assets.py --dist dist --output /tmp/gmf-asset-audit.json
      - name: Publish resource readiness summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('/tmp/gmf-asset-audit.json')
          if path.is_file():
              report = json.loads(path.read_text())
              status = 'PASS' if report['complete'] else 'FAIL — course resources incomplete'
              text = (f"### Pathline resource integrity: {status}\n\n"
                      f"Verified: {report['verified']}/{report['resource_count']}; "
                      f"failures: {len(report['failures'])}.\n\n")
          else:
              text = '### Pathline resource integrity: FAIL — audit did not produce a report\n\n'
          text += ('Resources must not be replaced with placeholders to make CI pass. '
                   'Browser, real PDF and iPad Safari acceptance remain separate release requirements.\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(text)
          PY
      - name: Preserve complete resource audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pathline-resource-audit
          path: /tmp/gmf-asset-audit.json
          if-no-files-found: error
